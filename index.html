<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142235">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electro Master">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ELECTRO MASTER</title>
<style>
:root{--bg:#f2f5f8;--ink:#172638;--muted:#718096;--accent:#e5a928;--card:#fff;--line:#e2e8f0;--nav:#142235}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}
header{background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px}
header h1{margin:0;font-size:21px;letter-spacing:1px}header p{margin:5px 0 0;color:#b8c7d8;font-size:12px}
main{padding:16px;max-width:760px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
.tabs button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px 3px;flex:1}.tabs button.active{color:#b77c00;font-weight:700}.tabs span{display:block;font-size:19px;margin-bottom:3px}
h2{font-size:20px;margin:4px 0 14px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 2px 8px #14223508}
.stat{font-size:23px;font-weight:800;margin-top:7px}.statlabel{font-size:12px;color:var(--muted)}
button,.btn{cursor:pointer}.primary{background:var(--nav);color:#fff;border:0;border-radius:11px;padding:13px 15px;font-weight:700;width:100%;font-size:15px}.secondary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}.danger{color:#b42318}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d5dde6;border-radius:10px;background:#fff;font:16px inherit;color:var(--ink)}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.pill{font-size:11px;background:#fff4d6;color:#8c6100;border-radius:20px;padding:4px 8px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.small{font-size:12px}.total{font-size:25px;font-weight:800}.right{text-align:right}.empty{text-align:center;padding:30px 12px;color:var(--muted)}
@media print{header,.tabs,.no-print{display:none!important}body{background:#fff;padding:0}main{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><h1>⚡ ELECTRO MASTER</h1><p>Сметы · Материалы · Работы · Объекты</p></header>
<main id="app"></main>
<nav class="tabs no-print">
<button data-tab="home" class="active"><span>⌂</span>Главная</button>
<button data-tab="estimate"><span>＋</span>Смета</button>
<button data-tab="materials"><span>▤</span>Материалы</button>
<button data-tab="labor"><span>⚒</span>Работы</button>
<button data-tab="more"><span>•••</span>Ещё</button>
</nav>
<script>
const KEY='electro_master_db_v1';
const defaults={rate:19.5, currency:'MDL', materials:[
{id:1,name:'Кабель ВВГнг 3×2,5',unit:'м',price:18,stock:0},
{id:2,name:'Кабель ВВГнг 3×1,5',unit:'м',price:13,stock:0},
{id:3,name:'Подрозетник',unit:'шт',price:8,stock:0},
{id:4,name:'Розетка',unit:'шт',price:45,stock:0},
{id:5,name:'Выключатель',unit:'шт',price:40,stock:0},
{id:6,name:'Распределительная коробка',unit:'шт',price:22,stock:0}],
labor:[
{id:1,name:'Прокладка кабеля',unit:'м',price:8},
{id:2,name:'Установка подрозетника',unit:'шт',price:35},
{id:3,name:'Монтаж розетки',unit:'шт',price:45},
{id:4,name:'Монтаж выключателя',unit:'шт',price:45},
{id:5,name:'Монтаж распределительной коробки',unit:'шт',price:80},
{id:6,name:'Штробление',unit:'м',price:45}],
clients:[],projects:[],inventory:[]};
let db=load(),tab='home',draft={name:'',client:'',currency:'MDL',materials:[],labor:[],extra:0};
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n,c=db.currency){let v=Number(n)||0;if(c==='EUR')v=v/(Number(db.rate)||19.5);return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+' '+c}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function totals(d=draft){let m=d.materials.reduce((s,x)=>s+x.qty*x.price,0),l=d.labor.reduce((s,x)=>s+x.qty*x.price,0),extra=(+d.extra||0)*(d.currency==='EUR'?(Number(db.rate)||19.5):1);return {m,l,extra,total:m+l+extra}}
function render(){
let a=document.getElementById('app');
if(tab==='home'){let sum=db.projects.reduce((s,p)=>s+p.total,0);a.innerHTML=`<h2>Рабочая панель</h2><div class="grid"><div class="card"><div class="statlabel">Сохранённых смет</div><div class="stat">${db.projects.length}</div></div><div class="card"><div class="statlabel">Сумма объектов</div><div class="stat">${money(sum)}</div></div><div class="card"><div class="statlabel">Материалов в базе</div><div class="stat">${db.materials.length}</div></div><div class="card"><div class="statlabel">Расценок на работы</div><div class="stat">${db.labor.length}</div></div></div><button class="primary" onclick="newEstimate()">＋ Создать новую смету</button><h2 style="margin-top:22px">Последние объекты</h2>${db.projects.slice(-5).reverse().map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="row small muted"><span>${esc(p.date)}</span><b>${money(p.total,p.currency)}</b></div></div>`).join('')||'<div class="empty">Пока нет сохранённых смет</div>'}`}
if(tab==='estimate') renderEstimate(a);
if(tab==='materials') renderCatalog(a,'materials');
if(tab==='labor') renderCatalog(a,'labor');
if(tab==='more') a.innerHTML=`<h2>Дополнительные разделы</h2><div class="card"><b>Клиенты</b><p class="muted small">Контактная база заказчиков</p><button class="secondary" onclick="addClient()">＋ Добавить клиента</button>${db.clients.map(c=>`<div class="item">${esc(c.name)} <span class="muted small">${esc(c.phone)}</span></div>`).join('')}</div><div class="card"><b>Склад и остатки</b><p class="muted small">Остатки учитываются в карточках материалов.</p>${db.materials.map(m=>`<div class="item"><span>${esc(m.name)}</span><b>${m.stock||0} ${esc(m.unit)}</b></div>`).join('')}</div><div class="card"><b>Аналитика</b><div class="item"><span>Выручка по сметам</span><b>${money(db.projects.reduce((s,p)=>s+p.total,0))}</b></div><div class="item"><span>Всего материалов</span><b>${db.materials.length}</b></div><div class="item"><span>Всего видов работ</span><b>${db.labor.length}</b></div></div><div class="card"><b>Настройки</b><label>Курс EUR → MDL</label><input id="rate" type="number" step=".01" value="${db.rate}"><button class="secondary" style="margin-top:8px;width:100%" onclick="saveRate()">Сохранить курс</button><div class="actions"><button class="secondary" onclick="backup()">Экспорт базы</button><button class="secondary" onclick="document.getElementById('restore').click()">Импорт базы</button></div><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"><p class="small muted">Данные хранятся на этом устройстве. Регулярно создавай резервную копию.</p></div>`;
}
function renderCatalog(a,type){let arr=db[type],title=type==='materials'?'Материалы':'Работы';a.innerHTML=`<h2>База: ${title.toLowerCase()}</h2><div class="card"><label>Название</label><input id="newName" placeholder="Например, кабель ВВГнг 3×4"><div class="row"><div><label>Единица</label><input id="newUnit" value="${type==='materials'?'м':'шт'}"></div><div><label>Цена за единицу (${db.currency})</label><input id="newPrice" type="number" step=".01" placeholder="0.00"></div></div><button class="primary" style="margin-top:12px" onclick="addItem('${type}')">Добавить в базу</button></div>${arr.map(x=>`<div class="card"><div class="item"><b>${esc(x.name)}</b><span class="pill">${money(x.price)}</span></div><div class="row small muted"><span>${esc(x.unit)}</span>${type==='materials'?`<span>Остаток: ${x.stock||0}</span>`:''}</div><div class="actions"><button class="secondary" onclick="editItem('${type}',${x.id})">Изменить</button><button class="secondary danger" onclick="deleteItem('${type}',${x.id})">Удалить</button></div></div>`).join('')}`}
function renderEstimate(a){let t=totals();a.innerHTML=`<h2>${draft.id?'Редактирование сметы':'Новая смета'}</h2><div class="card"><label>Название объекта</label><input id="estName" value="${esc(draft.name)}" placeholder="Например, квартира — ул. Штефан чел Маре"><label>Заказчик</label><select id="estClient"><option value="">Не выбран</option>${db.clients.map(c=>`<option ${draft.client===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Валюта сметы</label><select id="estCurrency"><option ${draft.currency==='MDL'?'selected':''}>MDL</option><option ${draft.currency==='EUR'?'selected':''}>EUR</option></select></div>
<div class="card"><b>Материалы</b><label>Добавить позицию</label><select id="matPick"><option value="">Выбери материал</option>${db.materials.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><div class="row"><input id="matQty" type="number" min="0" step=".01" placeholder="Количество"><button class="secondary" onclick="addToDraft('materials')">Добавить</button></div>${draft.materials.map((x,i)=>lineItem(x,i,'materials')).join('')||'<p class="muted small">Материалы ещё не добавлены</p>'}<div class="right"><b>Материалы: ${money(t.m,draft.currency)}</b></div></div>
<div class="card"><b>Работы</b><label>Добавить работу</label><select id="laborPick"><option value="">Выбери работу</option>${db.labor.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select><div class="row"><input id="laborQty" type="number" min="0" step=".01" placeholder="Количество"><button class="secondary" onclick="addToDraft('labor')">Добавить</button></div>${draft.labor.map((x,i)=>lineItem(x,i,'labor')).join('')||'<p class="muted small">Работы ещё не добавлены</p>'}<div class="right"><b>Работы: ${money(t.l,draft.currency)}</b></div></div>
<div class="card"><label>Дополнительные расходы (${draft.currency})</label><input id="extra" type="number" value="${draft.extra||0}" step=".01" onchange="draft.extra=this.value;render()"><div class="item"><span>Материалы</span><b>${money(t.m,draft.currency)}</b></div><div class="item"><span>Работа</span><b>${money(t.l,draft.currency)}</b></div><div class="item"><span>Дополнительные расходы</span><b>${money(t.extra,draft.currency)}</b></div><div class="item"><b>ИТОГО</b><span class="total">${money(t.total,draft.currency)}</span></div><p class="small muted">В этой версии прибыль до вычета фактической себестоимости ещё не рассчитывается отдельно.</p><button class="primary" onclick="saveEstimate()">Сохранить смету</button><button class="secondary" style="width:100%;margin-top:8px" onclick="printEstimate()">Печать / сохранить PDF</button></div>`}
function lineItem(x,i,type){return `<div class="item"><div style="flex:2"><b>${esc(x.name)}</b><div class="small muted">${x.qty} × ${money(x.price,draft.currency)}</div></div><b>${money(x.qty*x.price,draft.currency)}</b><button class="secondary" onclick="removeDraft('${type}',${i})">×</button></div>`}
function newEstimate(){draft={name:'',client:'',currency:db.currency,materials:[],labor:[],extra:0};setTab('estimate')}
function addToDraft(type){let id=+(document.getElementById(type==='materials'?'matPick':'laborPick').value),qty=+(document.getElementById(type==='materials'?'matQty':'laborQty').value);if(!id||qty<=0)return alert('Выбери позицию и введи количество.');let src=db[type].find(x=>x.id===id);draft[type].push({id:src.id,name:src.name,unit:src.unit,price:src.price,qty});render()}
function removeDraft(type,i){draft[type].splice(i,1);render()}
function saveEstimate(){draft.name=document.getElementById('estName').value.trim();draft.client=document.getElementById('estClient').value;draft.currency=document.getElementById('estCurrency').value;draft.extra=+(document.getElementById('extra').value||0);if(!draft.name)return alert('Введи название объекта.');let t=totals();let p={id:Date.now(),name:draft.name,client:draft.client,currency:draft.currency,date:new Date().toLocaleDateString('ru-RU'),materials:draft.materials,labor:draft.labor,extra:t.extra,total:t.total,materialTotal:t.m,laborTotal:t.l};db.projects.push(p);save();alert('Смета сохранена.');setTab('home')}
function printEstimate(){let t=totals();let w=window.open('','_blank');if(!w){alert('Разреши всплывающие окна для печати PDF.');return}w.document.write(`<html><head><meta charset="utf-8"><title>Смета ${esc(draft.name)}</title><style>body{font:14px Arial;padding:25px;color:#172638}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border:1px solid #bbb;padding:7px;text-align:left}.r{text-align:right}h1{font-size:22px}</style></head><body><h1>ELECTRO MASTER — СМЕТА</h1><h2>${esc(draft.name||'Новый объект')}</h2><p>Заказчик: ${esc(draft.client||'—')} · Дата: ${new Date().toLocaleDateString('ru-RU')}</p><h3>Материалы</h3>${printTable(draft.materials,draft.currency)}<h3>Работы</h3>${printTable(draft.labor,draft.currency)}<h3>Итоги</h3><p>Материалы: ${money(t.m,draft.currency)}</p><p>Работы: ${money(t.l,draft.currency)}</p><p>Дополнительные расходы: ${money(t.extra,draft.currency)}</p><h2>ИТОГО: ${money(t.total,draft.currency)}</h2><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function printTable(arr,currency=draft.currency){return '<table><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>'+arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.price,currency)}</td><td>${money(x.qty*x.price,currency)}</td></tr>`).join('')+'</table>'}
function addItem(type){let n=document.getElementById('newName').value.trim(),u=document.getElementById('newUnit').value.trim(),p=+document.getElementById('newPrice').value;if(!n||!u||p<0||!Number.isFinite(p))return alert('Заполни название, единицу и цену.');db[type].push({id:Date.now(),name:n,unit:u,price:p,stock:0});save();render()}
function editItem(type,id){let x=db[type].find(v=>v.id===id),n=prompt('Название',x.name);if(n===null)return;let p=prompt('Цена за '+x.unit,x.price);if(p===null)return;x.name=n.trim()||x.name;x.price=Math.max(0,+p||0);if(type==='materials'){let s=prompt('Остаток на складе',x.stock||0);if(s!==null)x.stock=Math.max(0,+s||0)}save();render()}
function deleteItem(type,id){if(confirm('Удалить позицию из базы?')){db[type]=db[type].filter(x=>x.id!==id);save();render()}}
function addClient(){let n=prompt('Имя / название клиента');if(!n)return;let phone=prompt('Телефон (необязательно)')||'';db.clients.push({name:n,phone});save();render()}
function saveRate(){db.rate=Math.max(.01,+document.getElementById('rate').value||19.5);save();alert('Курс сохранён.')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='electro-master-backup.json';a.click();URL.revokeObjectURL(url)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.materials||!x.labor||!x.projects)throw 0;db={...defaults,...x};save();alert('База восстановлена.');render()}catch(_){alert('Не удалось прочитать резервную копию.')}};r.readAsText(f)}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
