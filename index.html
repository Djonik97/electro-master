<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142235">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electro Master">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ELECTRO MASTER v2</title>
<style>
:root{--bg:#eef2f6;--ink:#172638;--muted:#718096;--accent:#e5a928;--card:#fff;--line:#dfe6ee;--nav:#142235;--green:#16845b;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{background:var(--nav);color:white;padding:calc(env(safe-area-inset-top) + 17px) 18px 17px;position:sticky;top:0;z-index:4}
header h1{margin:0;font-size:20px;letter-spacing:1px}header p{margin:5px 0 0;color:#bdcad8;font-size:12px}
main{padding:15px;max-width:780px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 2px calc(env(safe-area-inset-bottom) + 7px);z-index:5}
.tabs button{border:0;background:none;color:var(--muted);font-size:10px;padding:4px 1px;flex:1}.tabs button.active{color:#9a6800;font-weight:800}.tabs span{display:block;font-size:19px;margin-bottom:3px}
h2{font-size:20px;margin:4px 0 14px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 2px 8px #14223508}
.stat{font-size:23px;font-weight:800;margin-top:7px;overflow-wrap:anywhere}.statlabel{font-size:12px;color:var(--muted)}
button,.btn{cursor:pointer}.primary{background:var(--nav);color:#fff;border:0;border-radius:11px;padding:13px 15px;font-weight:700;width:100%;font-size:15px}.secondary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}.danger{color:var(--red)}.good{color:var(--green)}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5dde6;border-radius:10px;background:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);min-width:0}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.item{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.pill{font-size:11px;background:#fff4d6;color:#8c6100;border-radius:20px;padding:4px 8px;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;min-width:0}.right{text-align:right}.total{font-size:24px;font-weight:850}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.notice{background:#fff8e7;border:1px solid #f1d58b;border-radius:11px;padding:11px;font-size:12px;color:#74530b;margin-bottom:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title h3{margin:0;font-size:16px}
@media print{header,.tabs,.no-print{display:none!important}body{background:#fff;padding:0}main{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><h1>⚡ ELECTRO MASTER</h1><p>Профессиональный сметчик электромонтажника · v2</p></header>
<main id="app"></main>
<nav class="tabs no-print">
<button data-tab="home" class="active"><span>⌂</span>Главная</button>
<button data-tab="estimate"><span>＋</span>Смета</button>
<button data-tab="materials"><span>▤</span>Материалы</button>
<button data-tab="labor"><span>⚒</span>Работы</button>
<button data-tab="more"><span>•••</span>Ещё</button>
</nav>
<script>
'use strict';
const KEY='electro_master_db_v1';
const baseDefaults={schemaVersion:2,rate:19.5,currency:'MDL',materials:[
{id:1,name:'Кабель ВВГнг 3×2,5',unit:'м',price:18,stock:0},{id:2,name:'Кабель ВВГнг 3×1,5',unit:'м',price:13,stock:0},{id:3,name:'Подрозетник',unit:'шт',price:8,stock:0},{id:4,name:'Розетка',unit:'шт',price:45,stock:0},{id:5,name:'Выключатель',unit:'шт',price:40,stock:0},{id:6,name:'Распределительная коробка',unit:'шт',price:22,stock:0}],
labor:[{id:1,name:'Прокладка кабеля',unit:'м',price:8},{id:2,name:'Установка подрозетника',unit:'шт',price:35},{id:3,name:'Монтаж розетки',unit:'шт',price:45},{id:4,name:'Монтаж выключателя',unit:'шт',price:45},{id:5,name:'Монтаж распределительной коробки',unit:'шт',price:80},{id:6,name:'Штробление',unit:'м',price:45}],
clients:[],projects:[],inventory:[],expenses:[]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function migrateProject(p){let materials=(Array.isArray(p.materials)?p.materials:[]).map(x=>({...x,priceMDL:Number(x.priceMDL??x.price)||0,qty:Number(x.qty)||0}));let labor=(Array.isArray(p.labor)?p.labor:[]).map(x=>({...x,priceMDL:Number(x.priceMDL??x.price)||0,qty:Number(x.qty)||0}));let materialTotalMDL=Number(p.materialTotalMDL??p.materialTotal);if(!Number.isFinite(materialTotalMDL))materialTotalMDL=materials.reduce((s,x)=>s+x.qty*x.priceMDL,0);let laborTotalMDL=Number(p.laborTotalMDL??p.laborTotal);if(!Number.isFinite(laborTotalMDL))laborTotalMDL=labor.reduce((s,x)=>s+x.qty*x.priceMDL,0);let extraMDL=Number(p.extraMDL??p.extra)||0;let totalMDL=Number(p.totalMDL??p.total);if(!Number.isFinite(totalMDL))totalMDL=materialTotalMDL+laborTotalMDL+extraMDL;return {...p,materials,labor,materialTotalMDL,laborTotalMDL,extraMDL,totalMDL,rateAtSave:Number(p.rateAtSave)||19.5}}
function normalizeDB(old){return {...clone(baseDefaults),...old,schemaVersion:2,materials:Array.isArray(old.materials)?old.materials:[],labor:Array.isArray(old.labor)?old.labor:[],clients:Array.isArray(old.clients)?old.clients:[],projects:Array.isArray(old.projects)?old.projects.map(p=>({...migrateProject(p),rateAtSave:Number(p.rateAtSave)||Number(old.rate)||19.5})):[],inventory:Array.isArray(old.inventory)?old.inventory:[],expenses:Array.isArray(old.expenses)?old.expenses:[]}}
function loadDB(){try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(!old)return clone(baseDefaults);return normalizeDB(old)}catch(e){return clone(baseDefaults)}}
let db=loadDB(),tab='home',draft=freshDraft();
function freshDraft(){return {name:'',client:'',currency:db.currency||'MDL',materials:[],labor:[],extra:0}}
function save(){db.schemaVersion=2;localStorage.setItem(KEY,JSON.stringify(db))}
function rate(){return Math.max(.0001,Number(db.rate)||19.5)}
// All catalog prices, stored estimate amounts and ledger amounts are canonical MDL.
function fromMDL(n,currency){return currency==='EUR'?Number(n)/rate():Number(n)}
function toMDL(n,currency){return currency==='EUR'?Number(n)*rate():Number(n)}
function moneyMDL(n,currency=db.currency){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(fromMDL(Number(n)||0,currency))+' '+currency}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function totals(){let m=draft.materials.reduce((s,x)=>s+x.qty*x.priceMDL,0),l=draft.labor.reduce((s,x)=>s+x.qty*x.priceMDL,0),extra=toMDL(Number(draft.extra)||0,draft.currency);return {m,l,extra,total:m+l+extra}}
function render(){let a=document.getElementById('app');if(tab==='home')renderHome(a);if(tab==='estimate')renderEstimate(a);if(tab==='materials'||tab==='labor')renderCatalog(a,tab);if(tab==='more')renderMore(a)}
function renderHome(a){let revenue=db.projects.reduce((s,p)=>s+(+p.totalMDL||0),0),expenses=db.expenses.reduce((s,x)=>s+(+x.amountMDL||0),0);a.innerHTML=`<h2>Рабочая панель</h2><div class="grid"><div class="card"><div class="statlabel">Сохранённых смет</div><div class="stat">${db.projects.length}</div></div><div class="card"><div class="statlabel">Сумма смет</div><div class="stat">${moneyMDL(revenue)}</div></div><div class="card"><div class="statlabel">Материалов в базе</div><div class="stat">${db.materials.length}</div></div><div class="card"><div class="statlabel">Расценок на работы</div><div class="stat">${db.labor.length}</div></div></div><div class="notice">Базовая валюта хранения — MDL. EUR пересчитывается по установленному курсу ${rate().toFixed(2)} MDL за 1 EUR. Изменение курса влияет на отображение, но не переписывает сохранённые суммы в MDL.</div><button class="primary" onclick="newEstimate()">＋ Создать новую смету</button><h2 style="margin-top:22px">История смет</h2>${db.projects.slice().reverse().slice(0,12).map(p=>`<div class="card"><div class="item"><b>${esc(p.name)}</b><span class="pill">${esc(p.date||'')}</span></div><div class="row"><span class="muted small">${esc(p.client||'Без заказчика')}</span><b>${moneyMDL(p.totalMDL||0,p.currency||'MDL')}</b></div><div class="actions"><button class="secondary" onclick="showProject(${p.id})">Открыть</button><button class="secondary danger" onclick="deleteProject(${p.id})">Удалить</button></div></div>`).join('')||'<div class="empty">Пока нет сохранённых смет</div>'}<div class="card"><div class="statlabel">Учёт расходов (введено вручную)</div><div class="stat">${moneyMDL(expenses)}</div><p class="small muted">Это сумма записанных расходов, а не автоматически рассчитанная чистая прибыль.</p></div>`}
function renderCatalog(a,type){let arr=db[type],title=type==='materials'?'Материалы':'Работы';a.innerHTML=`<h2>Каталог: ${title.toLowerCase()}</h2><div class="card"><label>Название</label><input id="newName" placeholder="${type==='materials'?'Например, кабель ВВГнг 3×4':'Например, монтаж автомата'}"><div class="row"><div><label>Единица</label><input id="newUnit" value="${type==='materials'?'м':'шт'}"></div><div><label>Цена за единицу (MDL)</label><input id="newPrice" type="number" min="0" step=".01" placeholder="0.00"></div></div><button class="primary" style="margin-top:12px" onclick="addItem('${type}')">Добавить в каталог</button></div>${arr.map(x=>`<div class="card"><div class="item"><b>${esc(x.name)}</b><span class="pill">${moneyMDL(x.price,'MDL')}</span></div><div class="row small muted"><span>${esc(x.unit)}</span>${type==='materials'?`<span>Остаток: ${Number(x.stock)||0}</span>`:''}</div><div class="actions"><button class="secondary" onclick="editItem('${type}',${x.id})">Изменить</button><button class="secondary danger" onclick="deleteItem('${type}',${x.id})">Удалить</button></div></div>`).join('')||'<div class="empty">Каталог пока пуст</div>'}`}
function renderEstimate(a){let t=totals();a.innerHTML=`<h2>Новая смета</h2><div class="card"><label>Название объекта</label><input id="estName" value="${esc(draft.name)}" placeholder="Например, электромонтаж квартиры"><label>Заказчик</label><select id="estClient"><option value="">Не выбран</option>${db.clients.map(c=>`<option value="${esc(c.name)}" ${draft.client===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Валюта отображения</label><select id="estCurrency" onchange="changeDraftCurrency(this.value)"><option value="MDL" ${draft.currency==='MDL'?'selected':''}>MDL</option><option value="EUR" ${draft.currency==='EUR'?'selected':''}>EUR</option></select><div class="small muted" style="margin-top:7px">Курс: 1 EUR = ${rate().toFixed(2)} MDL</div></div>
<div class="card"><b>Материалы</b><label>Добавить материал</label><select id="matPick"><option value="">Выбери материал</option>${db.materials.map(x=>`<option value="${x.id}">${esc(x.name)} — ${moneyMDL(x.price,'MDL')} / ${esc(x.unit)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input id="matQty" type="number" min=".01" step=".01" placeholder="Количество"><button class="secondary" onclick="addToDraft('materials')">Добавить</button></div>${draft.materials.map((x,i)=>lineItem(x,i,'materials')).join('')||'<p class="muted small">Материалы ещё не добавлены</p>'}<div class="right"><b>Итого: ${moneyMDL(t.m,draft.currency)}</b></div></div>
<div class="card"><b>Работы</b><label>Добавить работу</label><select id="laborPick"><option value="">Выбери работу</option>${db.labor.map(x=>`<option value="${x.id}">${esc(x.name)} — ${moneyMDL(x.price,'MDL')} / ${esc(x.unit)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input id="laborQty" type="number" min=".01" step=".01" placeholder="Количество"><button class="secondary" onclick="addToDraft('labor')">Добавить</button></div>${draft.labor.map((x,i)=>lineItem(x,i,'labor')).join('')||'<p class="muted small">Работы ещё не добавлены</p>'}<div class="right"><b>Итого: ${moneyMDL(t.l,draft.currency)}</b></div></div>
<div class="card"><label>Дополнительные расходы (${draft.currency})</label><input id="extra" type="number" min="0" step=".01" value="${Number(draft.extra)||0}" onchange="draft.extra=this.value;renderEstimate(document.getElementById('app'))"><div class="item"><span>Материалы</span><b>${moneyMDL(t.m,draft.currency)}</b></div><div class="item"><span>Работы</span><b>${moneyMDL(t.l,draft.currency)}</b></div><div class="item"><span>Дополнительные расходы</span><b>${moneyMDL(t.extra,draft.currency)}</b></div><div class="item"><b>ИТОГО</b><span class="total">${moneyMDL(t.total,draft.currency)}</span></div><button class="primary" onclick="saveEstimate()">Сохранить смету</button><button class="secondary" style="width:100%;margin-top:8px" onclick="printEstimate()">Печать / сохранить PDF</button></div>`}
function lineItem(x,i,type){return `<div class="item"><div style="flex:2"><b>${esc(x.name)}</b><div class="small muted">${x.qty} ${esc(x.unit)} × ${moneyMDL(x.priceMDL,draft.currency)}</div></div><b>${moneyMDL(x.qty*x.priceMDL,draft.currency)}</b><button class="secondary" onclick="removeDraft('${type}',${i})">×</button></div>`}
function newEstimate(){draft=freshDraft();setTab('estimate')}
function changeDraftCurrency(c){let previous=draft.currency||'MDL';let extraMDL=toMDL(Number(draft.extra)||0,previous);draft.currency=c;draft.extra=fromMDL(extraMDL,c);renderEstimate(document.getElementById('app'))}
function addToDraft(type){let id=+(document.getElementById(type==='materials'?'matPick':'laborPick').value),qty=+(document.getElementById(type==='materials'?'matQty':'laborQty').value);if(!id||!Number.isFinite(qty)||qty<=0)return alert('Выбери позицию и введи количество больше нуля.');let src=db[type].find(x=>x.id===id);draft[type].push({id:src.id,name:src.name,unit:src.unit,priceMDL:Number(src.price)||0,qty});renderEstimate(document.getElementById('app'))}
function removeDraft(type,i){draft[type].splice(i,1);renderEstimate(document.getElementById('app'))}
function saveEstimate(){draft.name=document.getElementById('estName').value.trim();draft.client=document.getElementById('estClient').value;draft.currency=document.getElementById('estCurrency').value;draft.extra=Number(document.getElementById('extra').value)||0;if(!draft.name)return alert('Введи название объекта.');let t=totals();let p={id:Date.now(),name:draft.name,client:draft.client,currency:draft.currency,date:new Date().toLocaleDateString('ru-RU'),materials:clone(draft.materials),labor:clone(draft.labor),extraMDL:t.extra,totalMDL:t.total,materialTotalMDL:t.m,laborTotalMDL:t.l,rateAtSave:rate()};db.projects.push(p);save();alert('Смета сохранена.');draft=freshDraft();setTab('home')}
function printEstimate(){let t=totals(),w=window.open('','_blank');if(!w)return alert('Разреши всплывающие окна для печати / PDF.');w.document.write(`<html><head><meta charset="utf-8"><title>Смета ${esc(draft.name)}</title><style>body{font:14px Arial;padding:25px;color:#172638}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border:1px solid #bbb;padding:7px;text-align:left}.r{text-align:right}h1{font-size:22px}</style></head><body><h1>ELECTRO MASTER — СМЕТА</h1><h2>${esc(draft.name||'Новый объект')}</h2><p>Заказчик: ${esc(draft.client||'—')} · Дата: ${new Date().toLocaleDateString('ru-RU')}</p><p>Курс: 1 EUR = ${rate().toFixed(2)} MDL</p><h3>Материалы</h3>${printTable(draft.materials)}<h3>Работы</h3>${printTable(draft.labor)}<h3>Итоги</h3><p>Материалы: ${moneyMDL(t.m,draft.currency)}</p><p>Работы: ${moneyMDL(t.l,draft.currency)}</p><p>Дополнительные расходы: ${moneyMDL(t.extra,draft.currency)}</p><h2>ИТОГО: ${moneyMDL(t.total,draft.currency)}</h2><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function printTable(arr){return '<table><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>'+arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${moneyMDL(x.priceMDL,draft.currency)}</td><td>${moneyMDL(x.qty*x.priceMDL,draft.currency)}</td></tr>`).join('')+'</table>'}
function addItem(type){let n=document.getElementById('newName').value.trim(),u=document.getElementById('newUnit').value.trim(),p=Number(document.getElementById('newPrice').value);if(!n||!u||!Number.isFinite(p)||p<0)return alert('Заполни название, единицу и корректную цену.');db[type].push({id:Date.now(),name:n,unit:u,price:p,...(type==='materials'?{stock:0}:{})});save();render()}
function editItem(type,id){let x=db[type].find(v=>v.id===id);if(!x)return;let n=prompt('Название',x.name);if(n===null)return;let p=prompt('Цена за единицу в MDL',x.price);if(p===null)return;let pn=Number(p);if(!Number.isFinite(pn)||pn<0)return alert('Цена должна быть числом не меньше нуля.');x.name=n.trim()||x.name;x.price=pn;if(type==='materials'){let s=prompt('Остаток на складе',x.stock||0);if(s!==null&&Number.isFinite(Number(s))&&Number(s)>=0)x.stock=Number(s)}save();render()}
function deleteItem(type,id){if(!confirm('Удалить позицию из каталога? Уже сохранённые сметы не изменятся.'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
function addClient(){let n=prompt('Имя / название клиента');if(!n)return;let phone=prompt('Телефон (необязательно)')||'';db.clients.push({id:Date.now(),name:n.trim(),phone});save();render()}
function addExpense(){let name=prompt('Название расхода');if(!name)return;let amount=Number(prompt('Сумма расхода в MDL','0'));if(!Number.isFinite(amount)||amount<0)return alert('Некорректная сумма.');db.expenses.push({id:Date.now(),name,amountMDL:amount,date:new Date().toLocaleDateString('ru-RU')});save();render()}
function saveRate(){let n=Number(document.getElementById('rate').value);if(!Number.isFinite(n)||n<=0)return alert('Курс должен быть больше нуля.');db.rate=n;save();alert('Курс сохранён.');render()}
function backup(){save();let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='electro-master-backup-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.materials)||!Array.isArray(x.labor)||!Array.isArray(x.projects))throw Error();db=normalizeDB(x);save();alert('Резервная копия восстановлена.');render()}catch(_){alert('Файл не распознан. База не изменена.')}finally{e.target.value=''}};r.readAsText(f)}
function renderMore(a){a.innerHTML=`<h2>Дополнительные разделы</h2><div class="card"><div class="section-title"><h3>Клиенты</h3><button class="secondary" onclick="addClient()">＋ Добавить</button></div>${db.clients.map(c=>`<div class="item"><span><b>${esc(c.name)}</b><br><small class="muted">${esc(c.phone||'')}</small></span></div>`).join('')||'<p class="small muted">Клиентов пока нет.</p>'}</div><div class="card"><h3>Склад</h3>${db.materials.map(m=>`<div class="item"><span>${esc(m.name)}</span><b>${Number(m.stock)||0} ${esc(m.unit)}</b></div>`).join('')}</div><div class="card"><div class="section-title"><h3>Расходы</h3><button class="secondary" onclick="addExpense()">＋ Добавить</button></div>${db.expenses.map(x=>`<div class="item"><span>${esc(x.name)}<br><small class="muted">${esc(x.date)}</small></span><b>${moneyMDL(x.amountMDL,'MDL')}</b></div>`).join('')||'<p class="small muted">Расходы пока не внесены.</p>'}</div><div class="card"><h3>Курс валют</h3><label>1 EUR = сколько MDL</label><input id="rate" type="number" min=".0001" step=".01" value="${rate()}"><button class="secondary" style="width:100%;margin-top:8px" onclick="saveRate()">Сохранить курс</button><p class="small muted">Все внутренние денежные суммы хранятся в MDL. EUR — отображение по курсу.</p></div><div class="card"><h3>Резервное копирование</h3><div class="actions"><button class="secondary" onclick="backup()">Экспорт базы</button><button class="secondary" onclick="document.getElementById('restore').click()">Импорт базы</button></div><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"><p class="small muted">Экспортируй резервную копию регулярно и перед обновлением приложения. Импорт заменит текущую базу данными из файла.</p></div><div class="card"><h3>О проекте</h3><p class="small muted">ELECTRO MASTER v2 · локальное хранение в браузере устройства. При очистке данных Safari база может быть удалена — сохраняй резервные копии.</p></div>`}
function showProject(id){let p=db.projects.find(x=>x.id===id);if(!p)return;alert(`${p.name}\\nЗаказчик: ${p.client||'—'}\\nДата: ${p.date}\\nМатериалы: ${moneyMDL(p.materialTotalMDL||0,p.currency)}\\nРаботы: ${moneyMDL(p.laborTotalMDL||0,p.currency)}\\nИТОГО: ${moneyMDL(p.totalMDL||0,p.currency)}`)}
function deleteProject(id){if(!confirm('Удалить эту сохранённую смету?'))return;db.projects=db.projects.filter(p=>p.id!==id);save();render()}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
